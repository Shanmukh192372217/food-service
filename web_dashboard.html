<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Service App - Selenium Test Ready</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #FF5722; --dark: #212529; --bg: #f4f7f6; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--dark); display: flex; justify-content: center; align-items: center; height: 100vh; }

        /* App Container */
        #phone-emulator { width: 400px; height: 800px; background: white; border: 12px solid #333; border-radius: 40px; position: relative; overflow: hidden; display: flex; flex-direction: column; }

        .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; background: var(--bg); overflow-y: auto; }
        .screen.active { display: flex; }

        /* Component Styles */
        .header { padding: 20px; background: white; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; position: sticky; top:0; z-index:100; }
        .scroll-area { flex: 1; padding: 15px; padding-bottom: 80px; }
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; }

        /* Nav */
        .bottom-nav { height: 70px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; position: absolute; bottom: 0; width: 100%; }
        .nav-item { color: #999; text-align: center; font-size: 10px; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }

        /* Splash */
        #splash { background: var(--primary); color: white; justify-content: center; align-items: center; z-index: 1000; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: var(--dark); color: white; padding: 10px; border-radius: 12px; text-align: center; }
    </style>
</head>
<body>

    <div id="phone-emulator">

        <!-- 1. SPLASH (ID: splash-screen) -->
        <div id="splash-screen" class="screen active">
            <i class="fas fa-utensils" style="font-size: 80px; margin-bottom: 20px;"></i>
            <h2>FOOD SERVICE</h2>
            <button id="btn-skip-splash" onclick="initApp()" style="margin-top: 50px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 8px 20px; border-radius: 20px; cursor: pointer;">ENTER</button>
        </div>

        <!-- 2. LOGIN (ID: login-screen) -->
        <div id="login-screen" class="screen" style="justify-content:center; padding: 30px; background: var(--primary);">
            <div style="background:white; padding: 30px; border-radius: 25px; text-align: center;">
                <h3>Login</h3>
                <input type="email" id="login-email" class="input" placeholder="Email">
                <input type="password" id="login-password" class="input" placeholder="Password">
                <button id="btn-login" class="btn btn-primary" onclick="doLogin()">LOGIN</button>
                <p id="login-error" style="color:red; font-size: 10px; margin-top: 10px;"></p>
            </div>
        </div>

        <!-- 3. USER HOME (ID: home-screen) -->
        <div id="home-screen" class="screen">
            <div class="header"><b>Available Food</b> <i class="fas fa-search"></i></div>
            <div id="food-list-container" class="scroll-area"></div>
            <div class="bottom-nav">
                <div class="nav-item active" onclick="navigateTo('home-screen')"><i class="fas fa-home"></i>Home</div>
                <div class="nav-item" id="nav-to-alerts" onclick="navigateTo('alerts-screen')"><i class="fas fa-bell"></i>Alerts</div>
                <div class="nav-item" id="nav-to-profile" onclick="navigateTo('profile-screen')"><i class="fas fa-user"></i>Profile</div>
            </div>
        </div>

        <!-- 4. ADMIN DASHBOARD (ID: admin-screen) -->
        <div id="admin-screen" class="screen">
            <div class="header"><b>Admin Console</b> <i class="fas fa-plus-circle" id="btn-open-upload" onclick="navigateTo('upload-screen')" style="color:var(--primary); font-size: 24px;"></i></div>
            <div class="scroll-area">
                <div class="stats-grid">
                    <div class="stat-card"><small>Total</small><br><b id="admin-stat-total">0</b></div>
                    <div class="stat-card"><small>Claimed</small><br><b id="admin-stat-claimed">0</b></div>
                </div>
                <div id="admin-food-list"></div>
                <button id="btn-admin-logout" onclick="doLogout()" style="margin-top: 20px; color: gray; border: none; background: none; width: 100%;">Logout</button>
            </div>
        </div>

        <!-- 5. UPLOAD (ID: upload-screen) -->
        <div id="upload-screen" class="screen">
            <div class="header"><i class="fas fa-arrow-left" onclick="navigateTo('admin-screen')"></i><b>Upload Food</b></div>
            <div class="scroll-area">
                <input type="text" id="up-food-name" class="input" placeholder="Food Name">
                <input type="text" id="up-quantity" class="input" placeholder="Quantity">
                <input type="text" id="up-expiry" class="input" placeholder="Expiry">
                <input type="text" id="up-hotel" class="input" placeholder="Hotel Name">
                <button id="btn-publish" class="btn btn-primary" onclick="doUpload()">PUBLISH</button>
            </div>
        </div>

        <!-- 6. ALERTS (ID: alerts-screen) -->
        <div id="alerts-screen" class="screen">
            <div class="header"><b>Notifications</b></div>
            <div id="notifications-list" class="scroll-area"></div>
            <div class="bottom-nav" id="nav-placeholder-1"></div>
        </div>

        <!-- 7. PROFILE (ID: profile-screen) -->
        <div id="profile-screen" class="screen">
            <div class="header"><b>My Profile</b></div>
            <div class="scroll-area" style="text-align: center;">
                <div style="width:70px; height:70px; background:var(--primary); color:white; border-radius:50%; margin:auto; display:flex; align-items:center; justify-content:center; font-size:24px;" id="user-initial">U</div>
                <h4 id="user-email-text">User Email</h4>
                <hr>
                <div id="user-claim-history" style="text-align: left; margin-top: 20px;"></div>
                <button id="btn-logout" class="btn" style="background:#eee; margin-top: 20px;" onclick="doLogout()">LOGOUT</button>
            </div>
            <div class="bottom-nav" id="nav-placeholder-2"></div>
        </div>

        <!-- 8. DETAIL MODAL (ID: detail-modal) -->
        <div id="detail-overlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); z-index:500; align-items:flex-end;">
            <div style="background:white; width:100%; padding:30px; border-radius:30px 30px 0 0; animation: slideUp 0.3s ease;">
                <h2 id="det-food-name">Food</h2>
                <p id="det-hotel-name" style="color:var(--primary)">Hotel</p>
                <p><b>Quantity:</b> <span id="det-qty"></span></p>
                <p><b>Expires:</b> <span id="det-exp"></span></p>
                <button id="btn-confirm-claim" class="btn btn-primary" onclick="confirmClaim()">CLAIM NOW</button>
                <button class="btn" style="background:#eee; margin-top:10px;" onclick="closeDetails()">CANCEL</button>
            </div>
        </div>

    </div>

    <script>
        const config = {
            apiKey: "AIzaSyApshLAqhNDOATm-4aBFrJHDwUlVzbFJwQ",
            authDomain: "foodserviceapp-ee902.firebaseapp.com",
            projectId: "foodserviceapp-ee902",
            appId: "1:195486608103:android:df2c7812d6713926f4d042"
        };
        firebase.initializeApp(config);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let selectedId = null;

        function navigateTo(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');

            if(['home-screen', 'alerts-screen', 'profile-screen'].includes(id)) {
                const nav = document.querySelector('#home-screen .bottom-nav').innerHTML;
                document.getElementById('nav-placeholder-1').innerHTML = nav;
                document.getElementById('nav-placeholder-2').innerHTML = nav;
                const idx = id === 'home-screen' ? 0 : id === 'alerts-screen' ? 1 : 2;
                document.querySelectorAll('.bottom-nav').forEach(bn => {
                    [...bn.children].forEach(c => c.classList.remove('active'));
                    bn.children[idx].classList.add('active');
                });
            }
        }

        function initApp() {
            document.getElementById('splash-screen').classList.remove('active');
            auth.onAuthStateChanged(user => {
                if(user) {
                    document.getElementById('user-email-text').innerText = user.email;
                    document.getElementById('user-initial').innerText = user.email[0].toUpperCase();
                    user.email === 'hoteladmin@gmail.com' ? navigateTo('admin-screen') : navigateTo('home-screen');
                    startSync();
                } else { navigateTo('login-screen'); }
            });
        }
        setTimeout(initApp, 2500);

        async function doLogin() {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-password').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch(err) { document.getElementById('login-error').innerText = err.message; }
        }

        function doLogout() { auth.signOut().then(() => location.reload()); }

        function startSync() {
            db.collection("foods").orderBy("createdAt", "desc").onSnapshot(snap => {
                const uList = document.getElementById('food-list-container');
                const aList = document.getElementById('admin-food-list');
                uList.innerHTML = ""; aList.innerHTML = "";
                let total = 0, claimed = 0;

                snap.forEach(doc => {
                    const f = doc.data(), id = doc.id;
                    total++; if(f.status === 'claimed') claimed++;

                    const card = `<div class="card" id="food-${id}" onclick="openDetails('${id}','${f.foodName}','${f.hotelName}','${f.quantity}','${f.expiry}')">
                        <span style="float:right; font-size:10px; color:${f.status==='available'?'green':'red'}">${f.status.toUpperCase()}</span>
                        <b>${f.foodName}</b><br><small>📍 ${f.hotelName}</small>
                    </div>`;

                    if(f.status === 'available') uList.innerHTML += card;
                    aList.innerHTML += `<div class="card" id="admin-food-${id}">
                        <b>${f.foodName}</b> <i class="fas fa-trash" style="float:right; color:red" onclick="db.collection('foods').doc('${id}').delete()"></i>
                        <br><small>${f.status}</small>
                    </div>`;
                });
                document.getElementById('admin-stat-total').innerText = total;
                document.getElementById('admin-stat-claimed').innerText = claimed;
            });

            db.collection("notifications").orderBy("time", "desc").limit(5).onSnapshot(snap => {
                const list = document.getElementById('notifications-list'); list.innerHTML = "";
                snap.forEach(doc => {
                    const n = doc.data();
                    list.innerHTML += `<div class="card" style="border-left-color:orange"><b>${n.title}</b><br><small>${n.message}</small></div>`;
                });
            });
        }

        function openDetails(id, name, hotel, qty, exp) {
            selectedId = id;
            document.getElementById('det-food-name').innerText = name;
            document.getElementById('det-hotel-name').innerText = hotel;
            document.getElementById('det-qty').innerText = qty;
            document.getElementById('det-exp').innerText = exp;
            document.getElementById('detail-overlay').style.display = 'flex';
        }

        function closeDetails() { document.getElementById('detail-overlay').style.display = 'none'; }

        async function confirmClaim() {
            const name = document.getElementById('det-food-name').innerText;
            const hotel = document.getElementById('det-hotel-name').innerText;
            await db.collection("foods").doc(selectedId).update({ status: 'claimed' });
            await db.collection("claimedFoods").add({ foodName: name, hotelName: hotel, user: auth.currentUser.email, time: Date.now() });
            await db.collection("notifications").add({ title: "Claimed!", message: name + " claimed", time: Date.now() });
            alert("Claimed!"); closeDetails();
        }

        async function doUpload() {
            const n = document.getElementById('up-food-name').value;
            const q = document.getElementById('up-quantity').value;
            const e = document.getElementById('up-expiry').value;
            const h = document.getElementById('up-hotel').value;
            if(!n || !h) return alert("Required");
            await db.collection("foods").add({ foodName: n, quantity: q, expiry: e, hotelName: h, status: 'available', createdAt: Date.now() });
            alert("Published!"); navigateTo('admin-screen');
        }
    </script>
</body>
</html>
