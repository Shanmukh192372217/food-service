<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Service App - Web</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #FF5722; --bg: #F8F9FA; }
        body { margin: 0; background: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .phone { width: 375px; height: 750px; background: white; border: 10px solid #333; border-radius: 40px; position: relative; overflow: hidden; }
        .screen { display: none; height: 100%; width: 100%; position: absolute; flex-direction: column; overflow-y: auto; background: var(--bg); }
        .active { display: flex !important; }
        #splash { background: var(--primary); color: white; justify-content: center; align-items: center; z-index: 5000; text-align: center; }
        #login { padding: 30px; justify-content: center; align-items: center; background: linear-gradient(180deg, #FF5722 0%, #E64A19 100%); }
        .card { background: white; margin: 15px; padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; }
        .btn { background: var(--primary); color: white; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; outline: none; box-sizing: border-box; }
        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 70px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-tab { color: #999; font-size: 10px; text-align: center; cursor: pointer; }
        .nav-tab.active { color: var(--primary); }
        .nav-tab i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="phone">
        <!-- 1. SPLASH -->
        <div id="splash" class="screen active">
            <i class="fas fa-utensils" style="font-size: 70px; margin-bottom: 20px;"></i>
            <h2 style="letter-spacing: 2px;">FOOD SERVICE</h2>
            <button id="skip-btn" onclick="startNow()" style="margin-top: 50px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; display: none;">ENTER APP</button>
        </div>

        <!-- 2. LOGIN -->
        <div id="login" class="screen">
            <div style="background: white; padding: 30px; border-radius: 30px; text-align: center; width: 90%;">
                <h2 style="margin:0;">Login</h2>
                <input type="email" id="email" class="input" placeholder="Email (hoteladmin@gmail.com)">
                <input type="password" id="pass" class="input" placeholder="Password">
                <button class="btn" onclick="doLogin()">LOGIN</button>
            </div>
        </div>

        <!-- 3. HOME -->
        <div id="home" class="screen">
            <div style="padding: 20px; background: white; border-bottom: 1px solid #eee; position: sticky; top:0; z-index:10;"><b>Nearby Food</b></div>
            <div id="food-list" style="padding-bottom: 80px;"></div>
            <div class="bottom-nav">
                <div class="nav-tab active" onclick="show('home')"><i class="fas fa-home"></i>Home</div>
                <div class="nav-tab" onclick="show('alerts')"><i class="fas fa-bell"></i>Alerts</div>
                <div class="nav-tab" onclick="show('profile')"><i class="fas fa-user"></i>Profile</div>
            </div>
        </div>

        <!-- 4. ADMIN -->
        <div id="admin" class="screen">
            <div style="padding: 20px; background: #212529; color: white; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:10;">
                <b>Admin Panel</b>
                <i class="fas fa-plus-circle" style="color: var(--primary); font-size: 24px;" onclick="show('upload')"></i>
            </div>
            <div id="admin-list" style="padding-bottom: 80px;"></div>
        </div>

        <!-- 5. UPLOAD -->
        <div id="upload" class="screen">
            <div style="padding: 20px; border-bottom: 1px solid #eee;"><i class="fas fa-arrow-left" onclick="show('admin')" style="margin-right: 15px;"></i><b>Upload Food</b></div>
            <div style="padding: 20px;">
                <input type="text" id="up-n" class="input" placeholder="Food Name">
                <input type="text" id="up-q" class="input" placeholder="Quantity">
                <input type="text" id="up-h" class="input" placeholder="Hotel Name">
                <button class="btn" onclick="doUpload()">PUBLISH</button>
            </div>
        </div>

        <!-- 6. ALERTS -->
        <div id="alerts" class="screen">
            <div style="padding: 20px; border-bottom: 1px solid #eee;"><b>Notifications</b></div>
            <div id="notif-list" style="padding: 20px;"></div>
            <div id="nav-c1" class="bottom-nav"></div>
        </div>

        <!-- 7. PROFILE -->
        <div id="profile" class="screen">
            <div style="padding: 20px; border-bottom: 1px solid #eee;"><b>My Profile</b></div>
            <div style="padding: 30px; text-align: center;">
                <div style="width:80px; height:80px; background: var(--primary); color:white; border-radius:50%; margin:auto; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:bold;" id="u-icon">U</div>
                <h3 id="u-email" style="margin-top:15px;">User</h3>
                <button onclick="auth.signOut().then(()=>location.reload())" style="color: red; background: none; border: none; font-weight: bold; margin-top: 30px; cursor: pointer;">LOGOUT</button>
            </div>
            <div id="nav-c2" class="bottom-nav"></div>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyApshLAqhNDOATm-4aBFrJHDwUlVzbFJwQ",
            authDomain: "foodserviceapp-ee902.firebaseapp.com",
            projectId: "foodserviceapp-ee902",
            appId: "1:195486608103:android:df2c7812d6713926f4d042"
        };
        firebase.initializeApp(config);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Show skip button after 4s
        setTimeout(() => { document.getElementById('skip-btn').style.display = 'inline-block'; }, 4000);

        function show(id) {
            console.log("Showing screen:", id);
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');

            if(['home', 'alerts', 'profile'].includes(id)) {
                const nav = document.querySelector('#home .bottom-nav').innerHTML;
                document.getElementById('nav-c1').innerHTML = nav;
                document.getElementById('nav-c2').innerHTML = nav;
                const idx = id==='home'?0:id==='alerts'?1:2;
                document.querySelectorAll('.bottom-nav').forEach(b => {
                    [...b.children].forEach(c => c.classList.remove('active'));
                    b.children[idx].classList.add('active');
                });
            }
        }

        function startNow() {
            document.getElementById('splash').classList.remove('active');
            auth.onAuthStateChanged(user => {
                if (user) {
                    document.getElementById('u-email').innerText = user.email;
                    document.getElementById('u-icon').innerText = user.email[0].toUpperCase();
                    user.email === 'hoteladmin@gmail.com' ? show('admin') : show('home');
                    startSync();
                } else { show('login'); }
            });
        }

        // Auto-entry
        setTimeout(startNow, 2000);

        async function doLogin() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch(err) { alert(err.message); }
        }

        function startSync() {
            db.collection("foods").orderBy("createdAt", "desc").onSnapshot(snap => {
                const h = document.getElementById('food-list'), a = document.getElementById('admin-list');
                h.innerHTML = ""; a.innerHTML = "";
                snap.forEach(doc => {
                    const f = doc.data(), id = doc.id;
                    const card = `<div class="card">
                        <span style="float:right; font-size:10px; font-weight:bold; color:${f.status==='available'?'green':'red'}">${f.status.toUpperCase()}</span>
                        <h3 style="margin:0;">${f.foodName}</h3>
                        <p style="color:#666; font-size:14px; margin:5px 0;">📍 ${f.hotelName}</p>
                        ${f.status==='available'?'<button class="btn" style="padding:8px; font-size:12px;" onclick="claim(\''+id+'\',\''+f.foodName+'\',\''+f.hotelName+'\')">CLAIM</button>':''}
                    </div>`;
                    if(f.status === 'available') h.innerHTML += card;
                    a.innerHTML += `<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                        <div><b>${f.foodName}</b><br><small>${f.status}</small></div>
                        <i class="fas fa-trash" style="color:red; cursor:pointer;" onclick="db.collection('foods').doc('${id}').delete()"></i>
                    </div>`;
                });
            });
        }

        async function claim(id, name, hotel) {
            await db.collection("foods").doc(id).update({ status: 'claimed' });
            await db.collection("claimedFoods").add({ foodName: name, hotelName: hotel, user: auth.currentUser.email, time: Date.now() });
            alert("Claimed!");
        }

        async function doUpload() {
            const n = document.getElementById('up-n').value, q = document.getElementById('up-q').value, h = document.getElementById('up-h').value;
            if(!n || !h) return alert("Fill fields");
            await db.collection("foods").add({ foodName: n, quantity: q, hotelName: h, status: 'available', createdAt: Date.now() });
            alert("Published!"); show('admin');
        }
    </script>
</body>
</html>
