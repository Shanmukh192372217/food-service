<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Service - Official Web</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #FF5722; }
        body { margin: 0; background: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .phone { width: 375px; height: 780px; background: #F8F9FA; border: 10px solid #333; border-radius: 40px; position: relative; overflow: hidden; }
        .screen { display: none; height: 100%; width: 100%; position: absolute; flex-direction: column; overflow-y: auto; }
        .screen.active { display: flex !important; }
        #splash { background: var(--primary); color: white; justify-content: center; align-items: center; z-index: 5000; }
        #login { background: linear-gradient(180deg, #FF5722 0%, #E64A19 100%); justify-content: center; align-items: center; padding: 30px; }
        .bottom-nav { height: 70px; background: white; border-top: 1px solid #eee; display: flex; position: absolute; bottom: 0; width: 100%; z-index: 1000; }
        .nav-tab { flex: 1; text-align: center; font-size: 10px; color: #999; padding-top: 12px; cursor: pointer; }
        .nav-tab.active { color: var(--primary); }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="phone">
        <!-- SPLASH -->
        <div id="splash" class="screen active">
            <i class="fas fa-utensils text-7xl mb-4"></i>
            <h1 class="text-2xl font-bold tracking-tighter">FOOD SERVICE</h1>
            <p class="text-xs mt-10 opacity-50">Checking Auth Status...</p>
        </div>

        <!-- LOGIN -->
        <div id="login" class="screen">
            <div class="bg-white p-8 rounded-3xl w-full text-center shadow-2xl">
                <h2 class="text-2xl font-bold mb-6">Login</h2>
                <input type="email" id="email" placeholder="Email" class="w-full p-4 border rounded-xl mb-4 outline-none focus:border-orange-500">
                <input type="password" id="pass" placeholder="Password" class="w-full p-4 border rounded-xl mb-6 outline-none focus:border-orange-500">
                <button onclick="doLogin()" class="w-full bg-orange-500 text-white p-4 rounded-xl font-bold">LOGIN</button>
            </div>
        </div>

        <!-- HOME -->
        <div id="home" class="screen">
            <div class="p-6 bg-white border-b sticky top-0 z-50"><h1 class="text-xl font-bold">Nearby Food</h1></div>
            <div id="food-list" class="p-4 pb-20"></div>
            <div class="bottom-nav">
                <div class="nav-tab active" onclick="show('home')"><i class="fas fa-home block text-xl mb-1"></i>Home</div>
                <div class="nav-tab" onclick="show('alerts')"><i class="fas fa-bell block text-xl mb-1"></i>Alerts</div>
                <div class="nav-tab" onclick="show('profile')"><i class="fas fa-user block text-xl mb-1"></i>Profile</div>
            </div>
        </div>

        <!-- ADMIN -->
        <div id="admin" class="screen">
            <div class="p-6 bg-gray-900 text-white flex justify-between items-center sticky top-0 z-50">
                <h1 class="font-bold">Admin Panel</h1>
                <i class="fas fa-plus-circle text-orange-500 text-2xl" onclick="show('upload')"></i>
            </div>
            <div id="admin-list" class="p-4"></div>
        </div>

        <!-- UPLOAD -->
        <div id="upload" class="screen">
            <div class="p-6 border-b flex items-center gap-4"><i class="fas fa-arrow-left" onclick="show('admin')"></i><b>Upload Food</b></div>
            <div class="p-6 space-y-4">
                <input type="text" id="up-n" placeholder="Food Name" class="w-full p-4 border rounded-xl">
                <input type="text" id="up-q" placeholder="Quantity" class="w-full p-4 border rounded-xl">
                <input type="text" id="up-h" placeholder="Hotel Name" class="w-full p-4 border rounded-xl">
                <button onclick="doUpload()" class="w-full bg-orange-500 text-white p-4 rounded-xl font-bold">PUBLISH</button>
            </div>
        </div>

        <!-- ALERTS -->
        <div id="alerts" class="screen">
            <div class="p-6 border-b"><b>Notifications</b></div>
            <div id="notif-list" class="p-4"></div>
            <div id="nav-clone-1" class="bottom-nav"></div>
        </div>

        <!-- PROFILE -->
        <div id="profile" class="screen">
            <div class="p-6 border-b"><b>My Profile</b></div>
            <div class="p-6 text-center">
                <div class="w-20 h-20 bg-orange-500 text-white rounded-full mx-auto flex items-center justify-center text-3xl font-bold mb-4" id="u-icon">U</div>
                <h3 id="u-email" class="font-bold">User</h3>
                <button onclick="auth.signOut().then(()=>location.reload())" class="mt-10 text-red-500 font-bold">LOGOUT</button>
            </div>
            <div id="nav-clone-2" class="bottom-nav"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyApshLAqhNDOATm-4aBFrJHDwUlVzbFJwQ",
            authDomain: "foodserviceapp-ee902.firebaseapp.com", // CORRECTED
            projectId: "foodserviceapp-ee902",
            appId: "1:195486608103:android:df2c7812d6713926f4d042"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(['home', 'alerts', 'profile'].includes(id)) {
                const nav = document.querySelector('#home .bottom-nav').innerHTML;
                document.getElementById('nav-clone-1').innerHTML = nav;
                document.getElementById('nav-clone-2').innerHTML = nav;
                // Highlight active
                const idx = id==='home'?0:id==='alerts'?1:2;
                document.querySelectorAll('.bottom-nav').forEach(b => {
                    [...b.children].forEach(c => c.classList.remove('active'));
                    b.children[idx].classList.add('active');
                });
            }
        }

        // AUTO-ENTER LOGIC
        auth.onAuthStateChanged(user => {
            console.log("Auth State Changed:", user);
            setTimeout(() => {
                document.getElementById('splash').classList.remove('active');
                if (user) {
                    document.getElementById('u-email').innerText = user.email;
                    document.getElementById('u-icon').innerText = user.email[0].toUpperCase();
                    user.email === 'hoteladmin@gmail.com' ? show('admin') : show('home');
                    startSync();
                } else { show('login'); }
            }, 2000);
        });

        async function doLogin() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch(err) { alert(err.message); }
        }

        function startSync() {
            db.collection("foods").orderBy("createdAt", "desc").onSnapshot(snap => {
                const h = document.getElementById('food-list'), a = document.getElementById('admin-list');
                h.innerHTML = ""; a.innerHTML = "";
                snap.forEach(doc => {
                    const f = doc.data(), id = doc.id;
                    const card = `<div class="card">
                        <span class="float-right text-[10px] font-bold ${f.status==='available'?'text-green-500':'text-red-500'}">${f.status.toUpperCase()}</span>
                        <h3 class="font-bold">${f.foodName}</h3>
                        <p class="text-sm text-gray-500">📍 ${f.hotelName}</p>
                        ${f.status==='available'?'<button class="w-full mt-4 bg-orange-500 text-white py-2 rounded-lg text-xs font-bold" onclick="claim(\''+id+'\',\''+f.foodName+'\',\''+f.hotelName+'\')">CLAIM</button>':''}
                    </div>`;
                    if(f.status === 'available') h.innerHTML += card;
                    a.innerHTML += `<div class="card flex justify-between items-center">
                        <div><b>${f.foodName}</b><br><small>${f.status}</small></div>
                        <i class="fas fa-trash text-red-400" onclick="db.collection('foods').doc('${id}').delete()"></i>
                    </div>`;
                });
            });

            db.collection("notifications").orderBy("time", "desc").limit(5).onSnapshot(snap => {
                const l = document.getElementById('notif-list'); l.innerHTML = "";
                snap.forEach(doc => {
                    const n = doc.data();
                    l.innerHTML += `<div class="card border-l-4 border-orange-500"><b>${n.title}</b><p class="text-xs">${n.message}</p></div>`;
                });
            });
        }

        async function claim(id, name, hotel) {
            await db.collection("foods").doc(id).update({ status: 'claimed' });
            await db.collection("claimedFoods").add({ foodName: name, hotelName: hotel, user: auth.currentUser.email, time: Date.now() });
            await db.collection("notifications").add({ title: "Claimed!", message: name + " claimed by " + auth.currentUser.email, time: Date.now() });
            alert("Food Claimed Successfully!");
        }

        async function doUpload() {
            const n = document.getElementById('up-n').value, q = document.getElementById('up-q').value, h = document.getElementById('up-h').value;
            if(!n || !h) return alert("Fill fields");
            await db.collection("foods").add({ foodName: n, quantity: q, hotelName: h, status: 'available', createdAt: Date.now() });
            alert("Published!"); show('admin');
        }
    </script>
</body>
</html>
